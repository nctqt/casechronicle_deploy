services:
  postgres:
    image: postgres:15-alpine
    container_name: casechronicle_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
        interval: 10s
        timeout: 5s
        retries: 5
          - internal
    restart: always

  backend:
    build: ../backend
    container_name: casechronicle_backend
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
        postgres:
            condition: service_healthy
    networks:
      - internal
    restart: always

  frontend:
    build: ../frontend
    container_name: casechronicle_frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: casechronicle_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
    restart: always

volumes:
  pgdata:
  frontend_dist:

networks:
  internal:
    driver: bridge
